name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  test:
    name: Jest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: healthai
          POSTGRES_PASSWORD: healthai_secret
          POSTGRES_DB: healthai_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://healthai:healthai_secret@localhost:5432/healthai_db
      ZITADEL_ISSUER: https://zitadel.example.com
      ZITADEL_AUDIENCE: healthai-web
      ZITADEL_JWKS_URI: https://zitadel.example.com/oauth/v2/keys
      API_KEY: test_api_key_32_chars_minimum_xxxxx
      FRONTEND_CLIENT_ID: healthai-web-client
      FRONTEND_ORIGIN: http://localhost:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test

  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi

  build-push:
    name: Build & Push → ghcr.io
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Check if version already published
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git tag -l "$VERSION" | grep -q .; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  $VERSION already tagged — skipping build"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
            echo "🚀 Building $VERSION"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.skip == 'false'

      - uses: docker/login-action@v3
        if: steps.check.outputs.skip == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.skip == 'false'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/healthai-corpo/healthai-api:${{ steps.version.outputs.version }}
            ghcr.io/healthai-corpo/healthai-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-push]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --bumped-version

      - name: Check if version already released
        id: check
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git tag -l "$VERSION" | grep -q .; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "⏭️  $VERSION already released — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: cliff
        if: steps.check.outputs.skip == 'false'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --unreleased --strip header

      - name: Create tag + GitHub Release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          body: ${{ steps.cliff.outputs.content }}
          token: ${{ secrets.GITHUB_TOKEN }}
